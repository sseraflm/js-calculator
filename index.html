<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Calculator</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <h1>Calculator</h1>
        <div id="inputs">
            <input type="text" id="numberOne" class="input" placeholder="Number One" />
            <input type="text" id="operator" class="input" placeholder="Operator" />
            <input type="text" id="numberTwo" class="input" placeholder="Number Two" />
            <button id="calculate">Calculate</button>
        </div>

        <div id="history">
            <h2 id="historyP">History</h2>
        </div>
        <script src="calculator.js"></script>
    </body>
</html>
